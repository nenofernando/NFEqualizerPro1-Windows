name: Build Windows VST3 Installer

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout plugin source
        uses: actions/checkout@v4

      - name: Checkout JUCE
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 9.0.1
          path: JUCE

      - name: Configure CMake
        run: cmake -B build -DJUCE_DIR="${{ github.workspace }}\JUCE" -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3
        run: cmake --build build --config Release --target NFEqualizer_VST3

      - name: Make sure NSIS is available
        run: |
          choco install nsis -y --no-progress
          echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: pwsh

      - name: Build installer (NSIS)
        working-directory: installer
        run: makensis windows-installer.nsi
        shell: cmd

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: NF-Equalizer-Pro-1-Windows-Installer
          path: installer/*.exe

      - name: Publish installer to nf-releases (depósito privado)
        env:
          GH_TOKEN: ${{ secrets.NF_RELEASES_TOKEN }}
        shell: bash
        run: |
          gh release view pro-eq --repo creativepfb/nf-releases >/dev/null 2>&1 || \
            gh release create pro-eq --repo creativepfb/nf-releases \
              --title "NF Pro Eq" \
              --notes "Instaladores publicados automaticamente pelo CI - sempre a versao mais recente."
          gh release upload pro-eq \
            "installer/pro-eq-windows-setup.exe" \
            --repo creativepfb/nf-releases --clobber
